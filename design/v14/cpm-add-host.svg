<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1040" viewBox="0 0 1600 1040" role="img"><title>CPM 全屏设置 · 添加 PS4 主机</title><desc>CPM 界面设计稿。下载速度、容量与任务状态均为演示数据。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}a{cursor:pointer}</style><defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="#13131b" stop-opacity="0"/><stop offset="1" stop-color="#101018" stop-opacity=".95"/></linearGradient></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#13131b"/><rect x="0" y="0" width="480" height="1040" rx="0" fill="#191922"/><text x="256" y="96" fill="#f0eff5" font-size="24" font-weight="800">CPM</text><text x="256" y="125" fill="#9c9baa" font-size="13" font-weight="400">设置</text><text x="256" y="188" fill="#777786" font-size="12" font-weight="650">应用设置</text><a xlink:href="cpm-settings-general.svg"><text x="256" y="237" fill="#a6a5b4" font-size="16" font-weight="400">常规</text></a><a xlink:href="cpm-settings-library.svg"><text x="256" y="286" fill="#a6a5b4" font-size="16" font-weight="400">游戏库</text></a><a xlink:href="cpm-settings-transfer.svg"><text x="256" y="335" fill="#a6a5b4" font-size="16" font-weight="400">下载与安装</text></a><text x="256" y="387" fill="#777786" font-size="12" font-weight="650">连接管理</text><a xlink:href="cpm-settings-servers.svg"><text x="256" y="436" fill="#a6a5b4" font-size="16" font-weight="400">文件服务器</text></a><a xlink:href="cpm-settings-hosts.svg"><rect x="242" y="458" width="210" height="42" rx="7" fill="#343440"/><text x="256" y="485" fill="#f0eff5" font-size="16" font-weight="600">PS4 主机</text></a><text x="256" y="537" fill="#777786" font-size="12" font-weight="650">应用信息</text><a xlink:href="cpm-settings-advanced.svg"><text x="256" y="586" fill="#a6a5b4" font-size="16" font-weight="400">更新与调试</text></a><a xlink:href="cpm-settings-about.svg"><text x="256" y="635" fill="#a6a5b4" font-size="16" font-weight="400">关于 CPM</text></a><path d="M256 793L433 793" stroke="#30303d" stroke-width="1" fill="none"/><text x="256" y="822" fill="#747482" font-size="12" font-weight="400">CPM · 桌面端</text><text x="540" y="107" fill="#f0eff5" font-size="29" font-weight="700">添加 PS4 主机</text><text x="540" y="142" fill="#9c9baa" font-size="14" font-weight="400">配置主机别名与 Remote Package Installer 地址。</text><a xlink:href="cpm-library-controller.svg"><rect x="1344" y="76" width="42" height="42" rx="21" fill="none" stroke="#686877" stroke-width="1.5"/><text x="1356" y="105" fill="#9c9baa" font-size="25" font-weight="400">×</text><text x="1351" y="140" fill="#9c9baa" font-size="11" font-weight="400">ESC</text></a><text x="540" y="216" fill="#c7c6d0" font-size="14" font-weight="600">别名</text><rect x="540" y="234" width="712" height="48" rx="6" fill="#20202b" stroke="#383844" stroke-width="1.5"/><text x="556" y="265" fill="#aaa9b9" font-size="16" font-weight="400">PS4 · 卧室</text><text x="540" y="337" fill="#c7c6d0" font-size="14" font-weight="600">主机地址 *</text><rect x="540" y="355" width="712" height="48" rx="6" fill="#20202b" stroke="#383844" stroke-width="1.5"/><text x="556" y="386" fill="#aaa9b9" font-size="16" font-weight="400">http://     192.168.1.110:12801</text><text x="540" y="432" fill="#9c9baa" font-size="13" font-weight="400">请填写 IP 与端口，常用端口为 12800 或 12801。</text><text x="540" y="464" fill="#9c9baa" font-size="13" font-weight="400">主机上需要运行 Remote Package Installer。</text><path d="M540 511L1252 511" stroke="#30303d" stroke-width="1" fill="none"/><a xlink:href="cpm-settings-hosts.svg"><rect x="921" y="544" width="88" height="36" rx="18" fill="#272731"/><text x="939" y="568" fill="#c1c0cc" font-size="13" font-weight="600">取消</text></a><rect x="1021" y="544" width="110" height="36" rx="18" fill="#272731"/><text x="1039" y="568" fill="#c1c0cc" font-size="13" font-weight="600">连接测试</text><rect x="1143" y="544" width="110" height="36" rx="18" fill="#f0eff5"/><text x="1161" y="568" fill="#13131b" font-size="13" font-weight="600">确认添加</text></svg>