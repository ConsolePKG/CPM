<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CPM · 游戏库与任务管理</title>
<style>
:root{color-scheme:dark;--bg:#16171e;--panel:#20222c;--muted:#9398aa;--line:#30333f;--accent:#83d9f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef0f6;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{border:0;color:inherit;background:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:5px}button:hover{color:white;background:#ffffff0b}nav{position:fixed;inset:0 auto 0 0;width:184px;padding:30px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#191b23;z-index:10}.brand{font-size:24px;font-weight:850;letter-spacing:3px;padding:0 16px 50px}.brand small{font-size:9px;color:var(--accent);letter-spacing:1px;display:block;margin-top:6px}nav button{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:8px;margin-bottom:7px;color:var(--muted)}nav button.active{background:#83d9f512;color:var(--accent)}.navIcon{width:22px;font-size:21px;text-align:center}.navBottom{margin-top:auto;font-size:11px;color:var(--muted);padding:16px;line-height:1.9}main{margin-left:184px;padding:34px 42px 70px;max-width:1900px}header{display:flex;align-items:center;gap:18px;margin-bottom:30px}h1{font-size:27px;font-weight:650;margin:0;letter-spacing:.5px}.muted{color:var(--muted)}.spacer{flex:1}.mode{display:flex;padding:4px;border:1px solid var(--line);border-radius:9px;gap:3px}.mode button{padding:7px 10px;font-size:12px;color:var(--muted);border-radius:5px}.mode button.active{background:#333642;color:white}.toolbar{display:flex;align-items:center;gap:16px;margin-bottom:24px;height:38px}.filterWrap{position:relative}.tool{border:1px solid var(--line);border-radius:7px;padding:9px 13px;color:#cdd1df}.filterPanel{display:none;position:absolute;top:100%;left:0;padding-top:10px;width:310px;z-index:20}.filterWrap:hover .filterPanel,.filterWrap.open .filterPanel{display:block}.filterInner{background:#252833;border:1px solid #3b3e4d;box-shadow:0 18px 60px #0008;border-radius:12px;padding:22px}.filterInner h3{margin:0 0 20px;font-size:16px}.filterInner label{display:block;color:var(--muted);font-size:12px;margin:18px 0 9px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:8px 12px;border:1px solid #414553;border-radius:6px}.chips button.selected{color:var(--accent);border-color:var(--accent);background:#83d9f510}select{background:#20222b;border:1px solid #414553;color:white;border-radius:5px;padding:8px;width:100%}.filterFoot{display:flex;justify-content:space-between;margin-top:22px;color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}.search{display:flex;align-items:center;gap:8px}.search input{visibility:hidden;width:0;padding:0;border:0;opacity:0;transition:width .2s;background:#242731;color:white;border-radius:6px;outline-offset:2px}.search.open input{visibility:visible;width:240px;padding:10px 13px;opacity:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card,155px),1fr));gap:30px 22px}.game{text-align:left;padding:0;min-width:0;border-radius:7px}.cover{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:7px;background:#282a36;transition:transform .2s,box-shadow .2s}.game:hover{background:none}.game:hover .cover{transform:translateY(-4px);box-shadow:0 12px 26px #0007}.cover img{width:100%;height:100%;object-fit:cover}.game h3{font-size:13px;font-weight:550;margin:12px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.game p{font-size:11px;color:var(--muted);margin:0}.badge{position:absolute;bottom:0;left:0;right:0;padding:15px 10px 10px;background:linear-gradient(transparent,#080a13ed);color:white;font-size:11px}.mini{height:3px;background:#ffffff30;margin-top:8px}.mini i,.bar i{display:block;height:100%;background:var(--accent)}.tasksTop{display:flex;align-items:end;margin:4px 0 30px;gap:36px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:2px;margin-bottom:9px}.metric strong{font-size:27px;font-weight:550}.metric strong small{font-size:12px;color:var(--muted);margin-left:5px}.connection{margin-left:auto;color:#b3c0cb;font-size:12px}.connection i{display:inline-block;width:6px;height:6px;background:#a8dd8c;border-radius:50%;margin-right:8px}.sectionTitle{display:flex;align-items:center;margin:28px 0 13px;font-size:14px;gap:10px}.sectionTitle span{color:var(--muted);font-size:12px}.sectionTitle:after{content:'';height:1px;background:var(--line);flex:1;margin-left:12px}.task{display:grid;grid-template-columns:130px 1fr;gap:26px;padding:24px;margin-bottom:12px;background:#1e2029;border:1px solid #2c303b;border-radius:10px}.task img{width:130px;height:174px;object-fit:cover;border-radius:5px}.taskTitle{display:flex;align-items:center;gap:16px}.task h2{font-size:20px;margin:0 0 7px;font-weight:600}.task .subtitle{font-size:11px;color:var(--muted)}.taskState{margin-left:auto;color:var(--accent);font-size:12px}.taskBody{display:grid;grid-template-columns:1fr 220px;gap:35px;margin-top:24px}.progressText{display:flex;justify-content:space-between;font-size:12px}.bar{height:5px;border-radius:4px;background:#3a3e4c;margin:11px 0;overflow:hidden}.facts{display:flex;gap:24px;margin-top:21px;font-size:12px}.facts span{color:var(--muted);margin-right:6px}.chart{width:100%;height:76px;display:block}.legend{font-size:9px;color:var(--muted);display:flex;justify-content:space-between}.legend b{color:var(--accent);font-weight:500}.actions{display:flex;gap:9px;justify-content:end;margin-top:15px}.actions button{border:1px solid #3b404d;padding:7px 13px;border-radius:6px;font-size:11px}.task.compact img{height:102px;width:76px}.task.compact{grid-template-columns:76px 1fr}.task.compact .taskBody{margin-top:15px;grid-template-columns:1fr 220px}.compact .facts{margin-top:12px}.empty{padding:70px;text-align:center;color:var(--muted)}.controllerHint{display:none}body.floating nav{inset:50% auto auto 18px;transform:translateY(-50%);width:72px;border:1px solid #3a3d49;border-radius:17px;padding:10px;background:#242630e8;box-shadow:0 20px 60px #0004}body.floating nav .brand,body.floating .navBottom,body.floating nav .label{display:none}body.floating nav button{padding:14px;justify-content:center;margin:2px 0}body.floating main{margin-left:100px}body.controller nav{inset:0 0 auto;width:auto;height:80px;flex-direction:row;padding:13px 40px;gap:12px;align-items:center;border-bottom:1px solid var(--line)}body.controller nav .brand{padding:0;margin-right:auto;font-size:22px}body.controller nav .brand small,body.controller .navBottom{display:none}body.controller nav button{margin:0;padding:13px 20px}body.controller main{margin:80px 0 0;padding:30px 48px 95px}body.controller .controllerHint{position:fixed;bottom:0;left:0;right:0;display:flex;gap:28px;padding:16px 48px;background:#191b23f5;border-top:1px solid var(--line);font-size:12px;color:var(--muted);z-index:30}kbd{font-family:inherit;border:1px solid #626778;border-radius:5px;padding:3px 7px;color:#ecf1fa;margin-right:6px}dialog{width:660px;max-width:90vw;background:#242630;color:white;border:1px solid #464b5c;border-radius:16px;padding:30px;box-shadow:0 30px 100px #0009}dialog::backdrop{background:#080a12bb;backdrop-filter:blur(8px)}.detail{display:flex;gap:28px}.detail img{width:185px;border-radius:7px}.detail h2{font-size:27px}.detail p{color:var(--muted);line-height:1.9}.primary{background:var(--accent);color:#10242c;padding:12px 18px;border-radius:6px;font-weight:600}.primary:hover{background:#b4ebff;color:#10242c}.close{float:right;font-size:24px}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#3d4656;padding:13px 24px;border-radius:8px;z-index:50;box-shadow:0 8px 30px #0005}.prototype{font-size:10px;color:#7d8395;text-align:right;margin-top:35px}@media(max-width:1000px){main{padding:25px}nav{width:150px}main{margin-left:150px}.taskBody{grid-template-columns:1fr 150px;gap:20px}.task{padding:18px;gap:20px}.mode button{font-size:10px}.connection{display:none}}@media(max-width:700px){nav{width:65px;padding:12px 5px}nav .label,.brand,.navBottom{display:none}nav button{padding:13px}main{margin-left:65px;padding:20px}header{flex-wrap:wrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.task{grid-template-columns:65px 1fr;gap:15px}.task img{width:65px;height:88px}.taskBody,.task.compact .taskBody{grid-template-columns:1fr}.chartArea{display:none}.facts{gap:10px;flex-wrap:wrap}.tasksTop{gap:18px}.metric strong{font-size:19px}body.controller nav{padding:8px;gap:0}body.controller nav button{padding:10px;font-size:11px}body.controller main{padding:20px}body.controller .controllerHint{padding:15px;gap:10px}.filterPanel{width:270px}.task h2{font-size:16px}}
</style>
<nav aria-label="主导航"><div class="brand">CPM<small>PLAY. WITHOUT LIMITS.</small></div><button data-page="library" class="active" title="游戏库"><span class="navIcon">▦</span><span class="label">游戏库</span></button><button data-page="tasks" title="任务管理"><span class="navIcon">↓</span><span class="label">任务管理</span></button><button data-page="hosts" title="主机与资源"><span class="navIcon">▱</span><span class="label">主机与资源</span></button><button data-page="settings" title="设置"><span class="navIcon">⚙</span><span class="label">设置</span></button><div class="navBottom">● &nbsp; PS4 Pro 已连接<br>192.168.1.108</div></nav>
<main><header><h1 id="pageTitle">游戏库</h1><span class="spacer"></span><div class="mode" aria-label="导航布局"><button data-mode="fixed" class="active">PC · 固定</button><button data-mode="floating">PC · 浮动</button><button data-mode="controller">手柄模式</button></div></header><div id="content"></div><div class="prototype">CPM / DESIGN 12 &nbsp; · &nbsp; 交互设计稿，任务数据为演示</div></main>
<div class="controllerHint"><span><kbd>← ↑ ↓ →</kbd>移动焦点</span><span><kbd>Enter / A</kbd>确认</span><span><kbd>Esc / B</kbd>返回</span><span style="margin-left:auto"><kbd>LB / RB</kbd>切换页面</span></div><dialog id="detail"><button class="close" aria-label="关闭">×</button><div id="detailContent"></div></dialog>
<script>
const names=["Cyberpunk 2077", "God of War", "Red Dead Redemption 2", "Horizon Zero Dawn", "The Witcher 3: Wild Hunt", "Death Stranding", "Sekiro: Shadows Die Twice", "Detroit: Become Human", "Days Gone", "Hogwarts Legacy", "Resident Evil 4", "No Man\u2019s Sky", "NieR:Automata", "KOF XV", "Skyrim", "Resident Evil 3", "Ghost of Tsushima", "Ace Combat 7"];
const games=names.slice(0,12).map((name,i)=>({name,i,type:i===10||i===14?'补丁':i===11?'DLC':'本体',size:[58.2,44.6,108.4,48.1,39.7,55.3][i%6]}));
let page='library',mode='fixed',query='',kind='全部',status='全部',sort='default',card=155;
const tasks=[{i:0,p:47,speed:42.9,state:'下载中'},{i:1,p:72,speed:18.6,state:'下载中'},{i:2,p:18,speed:0,state:'已暂停'},{i:3,p:0,speed:0,state:'等待中'},{i:6,p:100,speed:0,state:'已完成'}];
const content=document.querySelector('#content');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setMode(m){mode=m;document.body.className=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function navigate(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelector('#pageTitle').textContent={library:'游戏库',tasks:'任务管理',hosts:'主机与资源',settings:'设置'}[p];render();window.scrollTo(0,0)}
function render(){if(page==='library')library();else if(page==='tasks')taskPage();else if(page==='hosts')content.innerHTML='<div class="sectionTitle">已连接的主机</div><article class="task"><div class="navIcon">▱</div><div><h2>PlayStation 4 Pro</h2><p class="muted">192.168.1.108 · 在线</p><p>资源位置 &nbsp; NAS / PS4</p><p class="muted">可用空间 256 GB / 1 TB</p></div></article>';else {content.innerHTML='<div class="sectionTitle">导航布局</div><p class="muted">PC 模式支持左侧固定导航或悬浮导航；手柄模式将导航移至顶部。</p><div class="chips">'+['fixed','floating','controller'].map((m,i)=>`<button data-layout="${m}">${['左侧固定','左侧浮动','顶部导航'][i]}</button>`).join('')+'</div>';content.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>setMode(b.dataset.layout))}}
function library(){content.innerHTML=`<div class="toolbar"><div class="filterWrap"><button class="tool" id="filterButton" aria-expanded="false">☷ &nbsp; 筛选 <span id="filterCount"></span></button><div class="filterPanel"><div class="filterInner"><h3>筛选游戏</h3><label>内容类型</label><div class="chips" id="kinds">${['全部','本体','补丁','DLC'].map(k=>`<button class="${kind===k?'selected':''}" data-kind="${k}">${k}</button>`).join('')}</div><label>下载状态</label><select id="status">${['全部','下载中','已暂停','等待中','已完成','未下载'].map(s=>`<option ${status===s?'selected':''}>${s}</option>`).join('')}</select><label>排序方式</label><select id="sort"><option value="default">最近添加</option><option value="name">名称 A–Z</option><option value="size">文件大小</option></select><label>封面尺寸</label><input id="size" aria-label="封面尺寸" type="range" min="130" max="240" value="${card}"><div class="filterFoot"><button id="reset">重置</button><button id="done">完成</button></div></div></div></div><span class="muted" style="font-size:12px">NAS / PS4</span><span class="spacer"></span><span class="muted" id="count" style="font-size:12px"></span><div class="search ${query?'open':''}"><input id="search" aria-label="搜索游戏" placeholder="搜索游戏…" value="${esc(query)}"><button class="tool" id="searchButton" aria-label="展开搜索">⌕</button></div></div><div class="grid" style="--card:${card}px"></div>`;
const wrap=content.querySelector('.filterWrap'),fb=document.querySelector('#filterButton');fb.onclick=()=>{wrap.classList.toggle('open');fb.setAttribute('aria-expanded',wrap.classList.contains('open'))};document.querySelector('#done').onclick=()=>{wrap.classList.remove('open');fb.focus();fb.setAttribute('aria-expanded','false');wrap.querySelector('.filterPanel').style.display='none';setTimeout(()=>wrap.querySelector('.filterPanel').style.display='',300)};
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('selected',x===b));grid()});document.querySelector('#status').onchange=e=>{status=e.target.value;grid()};document.querySelector('#sort').value=sort;document.querySelector('#sort').onchange=e=>{sort=e.target.value;grid()};document.querySelector('#size').oninput=e=>{card=+e.target.value;document.querySelector('.grid').style.setProperty('--card',card+'px')};document.querySelector('#reset').onclick=()=>{kind=status='全部';sort='default';card=155;library()};document.querySelector('#searchButton').onclick=()=>{const s=document.querySelector('.search');s.classList.toggle('open');if(s.classList.contains('open'))document.querySelector('#search').focus();else{query='';document.querySelector('#search').value='';grid()}};document.querySelector('#search').oninput=e=>{query=e.target.value;grid()};grid()}
function grid(){let list=games.filter(g=>g.name.toLowerCase().includes(query.toLowerCase())&&(kind==='全部'||g.type===kind)&&(status==='全部'||(tasks.find(t=>t.i===g.i)?.state||'未下载')===status));if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='size')list.sort((a,b)=>b.size-a.size);document.querySelector('#count').textContent=list.length+' 个游戏';document.querySelector('#filterCount').textContent=(kind!=='全部'||status!=='全部')?'•':'';document.querySelector('.grid').innerHTML=list.length?list.map(g=>{const t=tasks.find(t=>t.i===g.i);return `<button class="game" data-game="${g.i}"><div class="cover"><img src="assets/${g.i}.jpg" alt="${esc(g.name)}">${t&&t.state!=='已完成'?`<div class="badge">${t.state} <span style="float:right">${t.p}%</span><div class="mini"><i style="width:${t.p}%"></i></div></div>`:''}</div><h3>${esc(g.name)}</h3><p>PS4 · ${g.type} ${t?.state==='已完成'?' · 已下载':''}</p></button>`}).join(''):'<div class="empty">没有符合条件的游戏</div>';document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(+b.dataset.game))}
function graph(id){let bars='',points=[];for(let n=0;n<42;n++){let y=18+Math.abs(Math.sin(n*.27+id)*25+Math.cos(n*.63)*10);bars+=`<rect x="${n*5.2}" y="${72-y}" width="3" height="${y}" fill="#6bbdd7" opacity=".7"/>`;points.push(`${n*5.2},${45-Math.sin(n*.2+id)*12}`)}return `<svg viewBox="0 0 220 76" class="chart" aria-label="演示网络与磁盘活动曲线">${bars}<polyline points="${points.join(' ')}" fill="none" stroke="#b5d99a" stroke-width="1.5"/></svg><div class="legend"><b>网络 ↓</b><span style="color:#b5d99a">磁盘读写</span><span>最近 60 秒</span></div>`}
function taskPage(){const active=tasks.filter(t=>t.state==='下载中'),speed=active.reduce((a,t)=>a+t.speed,0);content.innerHTML=`<div class="tasksTop"><div class="metric"><div class="eyebrow">总下载速度</div><strong>${speed.toFixed(1)}<small>MB/s</small></strong></div><div class="metric"><div class="eyebrow">正在下载</div><strong>${active.length}<small>个游戏</small></strong></div><div class="metric"><div class="eyebrow">磁盘剩余</div><strong>256<small>GB</small></strong></div><div class="connection"><i></i>PS4 Pro · 192.168.1.108</div><button class="tool" id="pauseAll">${active.length?'全部暂停':'继续下载'}</button></div>`;for(const [label,group] of [['正在下载',active],['下载队列',tasks.filter(t=>['已暂停','等待中'].includes(t.state))],['已完成',tasks.filter(t=>t.state==='已完成')]]){if(!group.length)continue;content.innerHTML+=`<div class="sectionTitle">${label}<span>${group.length}</span></div>`+group.map(t=>{const g=games[t.i],down=t.state==='下载中';return `<article class="task ${down?'':'compact'}"><img src="assets/${t.i}.jpg" alt="${esc(g.name)}"><div><div class="taskTitle"><div><h2>${esc(g.name)}</h2><div class="subtitle">PS4 · ${g.type} · NAS → PS4 Pro</div></div><span class="taskState" style="${!down?'color:#a0a6b6':''}">${t.state}</span></div><div class="taskBody"><div><div class="progressText"><span>${t.p}%</span><span class="muted">${(g.size*t.p/100).toFixed(1)} / ${g.size} GB</span></div><div class="bar"><i style="width:${t.p}%;${!down?'background:#747e92':''}"></i></div><div class="facts"><div><span>速度</span>${down?t.speed+' MB/s':'—'}</div><div><span>剩余时间</span>${down?Math.ceil(g.size*(1-t.p/100)*1024/t.speed/60)+' 分钟':t.state==='已完成'?'已完成':'—'}</div></div></div><div class="${down?'chartArea':''}">${down?graph(t.i):''}<div class="actions">${t.state!=='已完成'?`<button data-action="${t.i}">${down?'Ⅱ 暂停':t.state==='已暂停'?'▷ 继续':'↓ 立即下载'}</button>`:''}<button data-remove="${t.i}">${t.state==='已完成'?'清除记录':'取消'}</button></div></div></div></div></article>`}).join('')}
if(!tasks.length)content.innerHTML+='<div class="empty">暂无下载任务，可从游戏库添加。</div>';document.querySelector('#pauseAll').onclick=()=>{tasks.forEach(t=>{if(active.length&&t.state==='下载中')t.state='已暂停';else if(!active.length&&t.state==='已暂停'){t.state='下载中';t.speed=42.9}});taskPage()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>x.i===+b.dataset.action);t.state=t.state==='下载中'?'已暂停':'下载中';if(!t.speed)t.speed=26.8;taskPage()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{tasks.splice(tasks.findIndex(t=>t.i===+b.dataset.remove),1);taskPage();toast('已移除该演示任务')})}
const dialog=document.querySelector('#detail');dialog.querySelector('.close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};function openGame(i){const g=games[i],t=tasks.find(t=>t.i===i);document.querySelector('#detailContent').innerHTML=`<div class="detail"><img src="assets/${i}.jpg" alt=""><div><div class="eyebrow">PLAYSTATION 4</div><h2>${esc(g.name)}</h2><p>${g.type} · ${g.size} GB<br>资源位置 NAS / PS4<br>目标主机 PS4 Pro</p><button class="primary" id="download">${t?'查看下载任务':'加入下载队列'}</button></div></div>`;document.querySelector('#download').onclick=()=>{if(!t){tasks.push({i,p:0,speed:0,state:'等待中'});toast('已加入下载队列')}dialog.close();navigate('tasks')};dialog.showModal()}
let toastTimer;function toast(s){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=s;document.body.append(el);toastTimer=setTimeout(()=>el.remove(),2200)}
document.addEventListener('click',e=>{if(!e.target.closest('.filterWrap')){document.querySelector('.filterWrap')?.classList.remove('open');document.querySelector('#filterButton')?.setAttribute('aria-expanded','false')}});
function back(){if(dialog.open){dialog.close();return}if(document.querySelector('.filterWrap.open')){document.querySelector('.filterWrap').classList.remove('open');document.querySelector('#filterButton').focus();return}if(page!=='library')navigate('library');else if(document.querySelector('.search.open')){query='';library()}}
function move(key){const scope=dialog.open?dialog:document;const els=[...scope.querySelectorAll('button,input,select')].filter(e=>e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0&&getComputedStyle(e).visibility!=='hidden');const current=document.activeElement;if(!els.includes(current)){els[0]?.focus();return}const r=current.getBoundingClientRect(),x=r.x+r.width/2,y=r.y+r.height/2;let best,score=Infinity;for(const e of els){if(e===current)continue;const q=e.getBoundingClientRect(),dx=q.x+q.width/2-x,dy=q.y+q.height/2-y,primary=key==='ArrowRight'?dx:key==='ArrowLeft'?-dx:key==='ArrowDown'?dy:-dy,secondary=key==='ArrowRight'||key==='ArrowLeft'?Math.abs(dy):Math.abs(dx);if(primary>8&&primary+secondary*3<score){score=primary+secondary*3;best=e}}best?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!dialog.open){e.preventDefault();back()}}else if(mode==='controller'&&e.key.startsWith('Arrow')&&!['INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();move(e.key)}});
let previous=[];function poll(){const pad=navigator.getGamepads?.()[0];if(pad&&mode==='controller'){pad.buttons.forEach((b,i)=>{if(b.pressed&&!previous[i]){if(i===0)document.activeElement?.click();if(i===1)back();if(i===4||i===5)navigate(page==='library'?'tasks':'library');if(i>=12&&i<=15)move(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'][i-12])}});previous=pad.buttons.map(b=>b.pressed)}requestAnimationFrame(poll)}render();poll();
</script></html>
