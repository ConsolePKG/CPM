  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.primary{fill:#f5f7fa}.secondary{fill:#9aa4b2}.tertiary{fill:#6f7b8a}.nav{fill:#cbd3de;font-size:14px}.small{fill:#8d99a9;font-size:12px}.title{fill:#f6f7fa;font-size:26px;font-weight:600}.game{fill:#f0f3f6;font-size:14px;font-weight:500}.meta{fill:#8d99a9;font-size:12px}.key{fill:#151a21;font-size:11px;font-weight:700}
