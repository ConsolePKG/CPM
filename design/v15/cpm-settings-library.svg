<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1040" viewBox="0 0 1600 1040" role="img"><title>CPM 全屏设置 · 游戏库</title><desc>CPM 界面设计稿。下载速度、容量与任务状态均为演示数据。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}a{cursor:pointer}</style><defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="#13131b" stop-opacity="0"/><stop offset="1" stop-color="#101018" stop-opacity=".95"/></linearGradient></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#13131b"/><rect x="0" y="0" width="480" height="1040" rx="0" fill="#191922"/><text x="256" y="96" fill="#f0eff5" font-size="24" font-weight="800">CPM</text><text x="256" y="125" fill="#9c9baa" font-size="13" font-weight="400">设置</text><text x="256" y="188" fill="#777786" font-size="12" font-weight="650">应用设置</text><a xlink:href="cpm-settings-general.svg"><text x="256" y="237" fill="#a6a5b4" font-size="16" font-weight="400">常规</text></a><a xlink:href="cpm-settings-library.svg"><rect x="242" y="259" width="210" height="42" rx="7" fill="#343440"/><text x="256" y="286" fill="#f0eff5" font-size="16" font-weight="600">游戏库</text></a><a xlink:href="cpm-settings-transfer.svg"><text x="256" y="335" fill="#a6a5b4" font-size="16" font-weight="400">下载与安装</text></a><text x="256" y="387" fill="#777786" font-size="12" font-weight="650">连接管理</text><a xlink:href="cpm-settings-servers.svg"><text x="256" y="436" fill="#a6a5b4" font-size="16" font-weight="400">文件服务器</text></a><a xlink:href="cpm-settings-hosts.svg"><text x="256" y="485" fill="#a6a5b4" font-size="16" font-weight="400">PS4 主机</text></a><text x="256" y="537" fill="#777786" font-size="12" font-weight="650">应用信息</text><a xlink:href="cpm-settings-advanced.svg"><text x="256" y="586" fill="#a6a5b4" font-size="16" font-weight="400">更新与调试</text></a><a xlink:href="cpm-settings-about.svg"><text x="256" y="635" fill="#a6a5b4" font-size="16" font-weight="400">关于 CPM</text></a><path d="M256 793L433 793" stroke="#30303d" stroke-width="1" fill="none"/><text x="256" y="822" fill="#747482" font-size="12" font-weight="400">CPM · 桌面端</text><text x="540" y="107" fill="#f0eff5" font-size="29" font-weight="700">游戏库</text><text x="540" y="142" fill="#9c9baa" font-size="14" font-weight="400">调整游戏内容的组织方式与打开行为。</text><a xlink:href="cpm-library-controller.svg"><rect x="1344" y="76" width="42" height="42" rx="21" fill="none" stroke="#686877" stroke-width="1.5"/><text x="1356" y="105" fill="#9c9baa" font-size="25" font-weight="400">×</text><text x="1351" y="140" fill="#9c9baa" font-size="11" font-weight="400">ESC</text></a><text x="540" y="223" fill="#f0eff5" font-size="18" font-weight="550">聚合模式</text><text x="540" y="251" fill="#9c9baa" font-size="14" font-weight="400">将补丁与附加内容关联到游戏本体，不单独出现在游戏列表。</text><text x="540" y="273" fill="#9c9baa" font-size="14" font-weight="400">可在游戏详情中查看；建议搭配文件服务器的递归查询使用。</text><rect x="1206" y="205" width="46" height="26" rx="13" fill="#f0eff5"/><rect x="1230" y="209" width="18" height="18" rx="9" fill="#13131b"/><path d="M540 306L1252 306" stroke="#30303d" stroke-width="1" fill="none"/><text x="540" y="369" fill="#f0eff5" font-size="18" font-weight="550">显示 PKG 原始标题</text><text x="540" y="397" fill="#9c9baa" font-size="14" font-weight="400">关闭时使用文件名作为游戏标题。</text><rect x="1206" y="351" width="46" height="26" rx="13" fill="#444450"/><rect x="1210" y="355" width="18" height="18" rx="9" fill="#c2c2cf"/><path d="M540 452L1252 452" stroke="#30303d" stroke-width="1" fill="none"/><text x="540" y="515" fill="#f0eff5" font-size="18" font-weight="550">点击游戏时</text><text x="540" y="544" fill="#9c9baa" font-size="14" font-weight="400">选择点击游戏封面的默认行为。</text><rect x="540" y="573" width="352" height="88" rx="9" fill="#20202b" stroke="#69baff" stroke-width="1.5"/><rect x="560" y="600" width="20" height="20" rx="10" fill="none" stroke="#69baff" stroke-width="1.5"/><rect x="565" y="605" width="10" height="10" rx="5" fill="#69baff"/><text x="596" y="616" fill="#f0eff5" font-size="16" font-weight="550">查看详情</text><rect x="900" y="573" width="352" height="88" rx="9" fill="#20202b" stroke="#383844" stroke-width="1.5"/><rect x="920" y="600" width="20" height="20" rx="10" fill="none" stroke="#646472" stroke-width="1.5"/><text x="956" y="616" fill="#f0eff5" font-size="16" font-weight="550">直接安装</text></svg>