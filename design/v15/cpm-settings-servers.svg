<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1040" viewBox="0 0 1600 1040" role="img"><title>CPM 全屏设置 · 文件服务器</title><desc>CPM 界面设计稿。下载速度、容量与任务状态均为演示数据。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}a{cursor:pointer}</style><defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="#13131b" stop-opacity="0"/><stop offset="1" stop-color="#101018" stop-opacity=".95"/></linearGradient></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#13131b"/><rect x="0" y="0" width="480" height="1040" rx="0" fill="#191922"/><text x="256" y="96" fill="#f0eff5" font-size="24" font-weight="800">CPM</text><text x="256" y="125" fill="#9c9baa" font-size="13" font-weight="400">设置</text><text x="256" y="188" fill="#777786" font-size="12" font-weight="650">应用设置</text><a xlink:href="cpm-settings-general.svg"><text x="256" y="237" fill="#a6a5b4" font-size="16" font-weight="400">常规</text></a><a xlink:href="cpm-settings-library.svg"><text x="256" y="286" fill="#a6a5b4" font-size="16" font-weight="400">游戏库</text></a><a xlink:href="cpm-settings-transfer.svg"><text x="256" y="335" fill="#a6a5b4" font-size="16" font-weight="400">下载与安装</text></a><text x="256" y="387" fill="#777786" font-size="12" font-weight="650">连接管理</text><a xlink:href="cpm-settings-servers.svg"><rect x="242" y="409" width="210" height="42" rx="7" fill="#343440"/><text x="256" y="436" fill="#f0eff5" font-size="16" font-weight="600">文件服务器</text></a><a xlink:href="cpm-settings-hosts.svg"><text x="256" y="485" fill="#a6a5b4" font-size="16" font-weight="400">PS4 主机</text></a><text x="256" y="537" fill="#777786" font-size="12" font-weight="650">应用信息</text><a xlink:href="cpm-settings-advanced.svg"><text x="256" y="586" fill="#a6a5b4" font-size="16" font-weight="400">更新与调试</text></a><a xlink:href="cpm-settings-about.svg"><text x="256" y="635" fill="#a6a5b4" font-size="16" font-weight="400">关于 CPM</text></a><p